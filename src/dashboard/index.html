<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falcon Live Dashboard</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --border:    #30363d;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --pass:      #3fb950;
    --fail:      #f85149;
    --skip:      #d29922;
    --heal:      #58a6ff;
    --info:      #388bfd;
    --radius:    8px;
    --font:      'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background .3s;
  }
  #status-dot.live { background: var(--pass); box-shadow: 0 0 6px var(--pass); }

  #status-label { color: var(--muted); font-size: 12px; }

  .spacer { flex: 1; }

  #run-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* ── Summary tiles ── */
  #summary {
    display: flex;
    gap: 12px;
    padding: 20px 24px;
    flex-wrap: wrap;
  }

  .tile {
    flex: 1 1 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .tile-value {
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .tile-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
  }

  .tile.pass  .tile-value { color: var(--pass); }
  .tile.fail  .tile-value { color: var(--fail); }
  .tile.skip  .tile-value { color: var(--skip); }
  .tile.heal  .tile-value { color: var(--heal); }
  .tile.total .tile-value { color: var(--text); }

  /* ── Progress bar ── */
  #progress-wrap {
    padding: 0 24px 16px;
  }

  #progress-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
    display: flex;
  }

  .bar-segment {
    height: 100%;
    transition: width .4s ease;
  }

  .bar-pass { background: var(--pass); }
  .bar-fail { background: var(--fail); }
  .bar-skip { background: var(--skip); }

  /* ── Event feed ── */
  #feed-section {
    padding: 0 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #feed-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
  }

  .event-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-left-width: 3px;
    animation: slideIn .2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  .event-row.pass   { border-left-color: var(--pass); }
  .event-row.fail   { border-left-color: var(--fail); }
  .event-row.skip   { border-left-color: var(--skip); }
  .event-row.heal   { border-left-color: var(--heal); }
  .event-row.info   { border-left-color: var(--info); }
  .event-row.start  { border-left-color: var(--muted); }

  .event-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }

  .event-body { flex: 1; min-width: 0; }

  .event-name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .event-detail {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
    word-break: break-all;
  }

  .event-time {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  #empty-state {
    text-align: center;
    color: var(--muted);
    padding: 48px 0;
    font-size: 13px;
  }

  #empty-state .big { font-size: 32px; margin-bottom: 8px; }

  /* ── Healing trust panel (Phase 8) ── */
  #healing-section {
    padding: 0 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #healing-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
  }

  #healing-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 12px 0;
  }

  .pending-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--heal);
    border-radius: var(--radius);
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .pending-body { flex: 1; min-width: 200px; }

  .pending-selector {
    font-weight: 600;
    word-break: break-all;
  }

  .pending-detail {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
    word-break: break-all;
  }

  .pending-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: var(--bg);
    color: var(--text);
  }

  .btn-approve { border-color: var(--pass); color: var(--pass); }
  .btn-approve:hover { background: var(--pass); color: var(--bg); }
  .btn-reject { border-color: var(--fail); color: var(--fail); }
  .btn-reject:hover { background: var(--fail); color: var(--bg); }

  #healing-trend-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 8px;
  }

  #healing-trend-table th, #healing-trend-table td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }

  #healing-trend-table th {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: .6px;
  }
</style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>🦅 Falcon Live Dashboard</h1>
  <span id="status-label">Connecting…</span>
  <div class="spacer"></div>
  <span id="run-time">–</span>
</header>

<div id="summary">
  <div class="tile total"><div class="tile-value" id="t-total">0</div><div class="tile-label">Total</div></div>
  <div class="tile pass"><div class="tile-value" id="t-pass">0</div><div class="tile-label">Passed</div></div>
  <div class="tile fail"><div class="tile-value" id="t-fail">0</div><div class="tile-label">Failed</div></div>
  <div class="tile skip"><div class="tile-value" id="t-skip">0</div><div class="tile-label">Skipped</div></div>
  <div class="tile heal"><div class="tile-value" id="t-heal">0</div><div class="tile-label">Healed</div></div>
</div>

<div id="progress-wrap">
  <div id="progress-bar">
    <div class="bar-segment bar-pass" id="bar-pass" style="width:0%"></div>
    <div class="bar-segment bar-fail" id="bar-fail" style="width:0%"></div>
    <div class="bar-segment bar-skip" id="bar-skip" style="width:0%"></div>
  </div>
</div>

<div id="healing-section">
  <div id="healing-header">
    <span>Healing trust — awaiting review</span>
  </div>
  <div id="healing-pending-list">
    <div id="healing-empty">No Tier 3 (AI-inferred) fixes awaiting review.</div>
  </div>
  <table id="healing-trend-table" style="display:none">
    <thead>
      <tr><th>Selector</th><th>Occurrences</th><th>Tiers</th><th>Last outcome</th></tr>
    </thead>
    <tbody id="healing-trend-body"></tbody>
  </table>
</div>

<div id="feed-section">
  <div id="feed-header">
    <span>Event feed</span>
  </div>
  <div id="feed">
    <div id="empty-state">
      <div class="big">🕐</div>
      <div>Waiting for test events…</div>
    </div>
  </div>
</div>

<script>
  const state = { pass: 0, fail: 0, skip: 0, heal: 0, startTs: null, pending: new Map() };

  const $ = (id) => document.getElementById(id);

  function updateTiles() {
    const total = state.pass + state.fail + state.skip;
    $("t-total").textContent = total;
    $("t-pass").textContent  = state.pass;
    $("t-fail").textContent  = state.fail;
    $("t-skip").textContent  = state.skip;
    $("t-heal").textContent  = state.heal;

    if (total > 0) {
      $("bar-pass").style.width = (state.pass / total * 100) + "%";
      $("bar-fail").style.width = (state.fail / total * 100) + "%";
      $("bar-skip").style.width = (state.skip / total * 100) + "%";
    }
  }

  function fmt(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString("en-GB", { hour12: false });
  }

  function updateRunTime() {
    if (!state.startTs) return;
    const elapsed = ((Date.now() - state.startTs) / 1000).toFixed(1);
    $("run-time").textContent = `${elapsed}s elapsed`;
  }

  setInterval(updateRunTime, 500);

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[char]);
  }

  function addRow(type, icon, name, detail, ts) {
    const empty = $("empty-state");
    if (empty) empty.remove();

    const row = document.createElement("div");
    row.className = `event-row ${type}`;
    row.innerHTML = `
      <span class="event-icon">${icon}</span>
      <div class="event-body">
        <div class="event-name">${escapeHtml(name)}</div>
        ${detail ? `<div class="event-detail">${escapeHtml(detail)}</div>` : ""}
      </div>
      <span class="event-time">${fmt(ts)}</span>
    `;
    $("feed").prepend(row);
  }

  function handleEvent({ name, payload, timestamp }) {
    switch (name) {
      case "testStart":
        if (!state.startTs) state.startTs = timestamp;
        addRow("start", "▶", payload.testName || "Test started", null, timestamp);
        break;
      case "testPass":
        state.pass++;
        updateTiles();
        addRow("pass", "✅", payload.name, payload.duration ? `${payload.duration}ms` : null, timestamp);
        break;
      case "testFail":
        state.fail++;
        updateTiles();
        addRow("fail", "❌", payload.name, payload.error, timestamp);
        break;
      case "testSkip":
        state.skip++;
        updateTiles();
        addRow("skip", "⏭", payload.name, payload.reason, timestamp);
        break;
      case "healingEvent":
        state.heal++;
        updateTiles();
        addRow("heal", "🤖", `Healed: ${payload.original}`, `→ ${payload.resolved} [${payload.tier}]`, timestamp);
        break;
      case "explorerPage":
        addRow("info", "🌍", `Explored: ${payload.url}`, null, timestamp);
        break;
      case "testEnd":
        addRow("info", "🏁", `Completed: ${payload.testName}`, null, timestamp);
        break;
      case "healingPending":
        state.pending.set(payload.original, payload);
        renderPending();
        addRow("heal", "⏳", `Pending review: ${payload.original}`, `→ ${payload.suggested}`, timestamp);
        break;
      case "healingApproved":
        state.pending.delete(payload.original);
        renderPending();
        addRow("pass", "✅", `Approved: ${payload.original}`, `→ ${payload.suggested} (now trusted for Tier 2)`, timestamp);
        break;
      case "healingRejected":
        state.pending.delete(payload.original);
        renderPending();
        addRow("fail", "🚫", `Rejected: ${payload.original}`, `→ ${payload.suggested} (discarded)`, timestamp);
        break;
      default:
        addRow("info", "ℹ️", name, JSON.stringify(payload), timestamp);
    }
  }

  // ── Healing trust panel (Phase 8) ──

  function renderPending() {
    const list = $("healing-pending-list");
    const empty = $("healing-empty");
    const entries = [...state.pending.values()];

    if (entries.length === 0) {
      list.replaceChildren(empty || makeHealingEmpty());
      return;
    }

    list.replaceChildren(...entries.map((entry) => {
      const row = document.createElement("div");
      row.className = "pending-row";
      row.innerHTML = `
        <div class="pending-body">
          <div class="pending-selector">${escapeHtml(entry.original)}</div>
          <div class="pending-detail">→ ${escapeHtml(entry.suggested)}${entry.description ? ` — ${escapeHtml(entry.description)}` : ""}</div>
          <div class="pending-detail">seen ${entry.occurrences}× · last ${fmt(new Date(entry.lastSeen).getTime())}</div>
        </div>
        <div class="pending-actions">
          <button class="btn btn-approve" data-action="approve" data-selector="${escapeHtml(entry.original)}">Approve</button>
          <button class="btn btn-reject" data-action="reject" data-selector="${escapeHtml(entry.original)}">Reject</button>
        </div>
      `;
      return row;
    }));
  }

  function makeHealingEmpty() {
    const div = document.createElement("div");
    div.id = "healing-empty";
    div.textContent = "No Tier 3 (AI-inferred) fixes awaiting review.";
    return div;
  }

  $("healing-pending-list").addEventListener("click", async (event) => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    const { action, selector } = button.dataset;
    button.disabled = true;
    try {
      await healingDecision(action, selector);
    } catch (err) {
      button.disabled = false;
      alert(`Failed to ${action}: ${err.message}`);
    }
  });

  async function healingDecision(action, original) {
    const res = await fetch(`/healing/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeaders() },
      body: JSON.stringify({ original }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    // The socket "healingApproved"/"healingRejected" event that follows
    // updates state.pending and re-renders — no need to do it here too.
  }

  function authHeaders() {
    return dashboardToken ? { "X-Dashboard-Token": dashboardToken } : {};
  }

  async function renderTrend() {
    try {
      const res = await fetch("/healing/trend", { headers: authHeaders() });
      if (!res.ok) return;
      const rows = await res.json();
      const table = $("healing-trend-table");
      const body = $("healing-trend-body");
      if (rows.length === 0) { table.style.display = "none"; return; }
      table.style.display = "table";
      body.replaceChildren(...rows.map((row) => {
        const tr = document.createElement("tr");
        const tiers = Object.entries(row.tiers).map(([tier, count]) => `${tier}: ${count}`).join(", ");
        tr.innerHTML = `
          <td>${escapeHtml(row.original)}</td>
          <td>${row.occurrences}</td>
          <td>${escapeHtml(tiers)}</td>
          <td>${row.lastResolved ? `✅ ${escapeHtml(row.lastResolved)}` : "❌ unresolved"}</td>
        `;
        return tr;
      }));
    } catch {
      // Trend table is a nice-to-have — never let it break the live feed
    }
  }

  async function refreshHealing() {
    try {
      const res = await fetch("/healing/pending", { headers: authHeaders() });
      if (res.ok) {
        const entries = await res.json();
        state.pending = new Map(entries.map((entry) => [entry.original, entry]));
        renderPending();
      }
    } catch {
      // Best-effort — socket events will still keep this in sync going forward
    }
    renderTrend();
  }

  // Phase 7 — auth token. Read from ?token=, persist to localStorage so a
  // refresh doesn't require re-pasting it, then strip it from the visible
  // URL so it doesn't linger in browser history / get shared by accident.
  // localStorage is best-effort — a private window or blocked storage just
  // means the token has to come from the URL every time, which still works.
  function resolveToken() {
    const fromUrl = new URLSearchParams(location.search).get("token");
    if (fromUrl) {
      try { localStorage.setItem("falcon_dashboard_token", fromUrl); } catch {}
      const url = new URL(location.href);
      url.searchParams.delete("token");
      history.replaceState(null, "", url);
      return fromUrl;
    }
    try { return localStorage.getItem("falcon_dashboard_token") || undefined; } catch { return undefined; }
  }

  const dashboardToken = resolveToken();
  const socket = io({ auth: { token: dashboardToken } });

  socket.on("connect", () => {
    $("status-dot").classList.add("live");
    $("status-label").textContent = "Live";
    refreshHealing();
  });

  socket.on("disconnect", () => {
    $("status-dot").classList.remove("live");
    $("status-label").textContent = "Disconnected";
  });

  socket.on("connect_error", (err) => {
    $("status-dot").classList.remove("live");
    $("status-label").textContent = /unauthorized/i.test(err.message)
      ? "Unauthorized — check the dashboard URL/token"
      : `Connection error: ${err.message}`;
  });

  // Replay full history for late-joining tabs
  socket.on("replay", (events) => {
    Object.assign(state, { pass: 0, fail: 0, skip: 0, heal: 0, startTs: null, pending: new Map() });
    $("feed").replaceChildren();
    for (const id of ["bar-pass", "bar-fail", "bar-skip"]) $(id).style.width = "0%";
    $("run-time").textContent = "–";
    updateTiles();
    renderPending();
    events.forEach(handleEvent);
  });

  socket.on("event", handleEvent);
</script>
</body>
</html>
