version: 2
# Each ecosystem opens at most one grouped PR per weekly run. The groups cover
# every update type, so major bumps arrive in the same PR as minor/patch ones:
# review the major-version release notes before merging, don't just trust a
# green check.
updates:
  # Keeps the SHA-pinned action references in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm-all:
        patterns: ["*"]
