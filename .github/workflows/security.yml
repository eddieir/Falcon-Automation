name: Falcon Security

on:
  pull_request:
    branches: [New_era_Falcon, main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  snyk:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OUT_DIR: security-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Snyk CLI
        run: npm install --global snyk@1.1307.4
      - name: Check Snyk token is configured
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +x
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::the Snyk token secret is not configured for this repository"
            exit 1
          fi
      - run: npm ci
      - name: Prepare output directory
        run: mkdir -p "$OUT_DIR"
      - name: Snyk open source
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +x
          rc=0
          snyk test --all-projects --dev --severity-threshold=low --json-file-output="$OUT_DIR/snyk-test.json" || rc=$?
          echo "$rc" > "$OUT_DIR/snyk-test.rc"
      - name: Snyk code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +x
          rc=0
          snyk code test --severity-threshold=low --json-file-output="$OUT_DIR/snyk-code.json" || rc=$?
          echo "$rc" > "$OUT_DIR/snyk-code.rc"
      - name: npm audit production
        run: |
          rc=0
          npm audit --omit=dev --audit-level=high --json > "$OUT_DIR/npm-audit-prod.json" || rc=$?
          echo "$rc" > "$OUT_DIR/npm-audit-prod.rc"
      - name: npm audit all
        run: |
          rc=0
          npm audit --audit-level=high --json > "$OUT_DIR/npm-audit-all.json" || rc=$?
          echo "$rc" > "$OUT_DIR/npm-audit-all.rc"
      # Same digest as the CI postgres service image (BL-001 follow-up there).
      - name: Snyk container
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +x
          rc=0
          snyk container test postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea --severity-threshold=low --json-file-output="$OUT_DIR/snyk-container.json" || rc=$?
          echo "$rc" > "$OUT_DIR/snyk-container.rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-out/
          if-no-files-found: warn
          retention-days: 14
      # Exit 0 is clean; 1 is findings; anything else (2/3, missing file) is an
      # operational failure and is never treated as clean.
      - name: Evaluate results
        if: always()
        run: |
          fail=0
          for t in snyk-test snyk-code npm-audit-prod npm-audit-all snyk-container; do
            f="$OUT_DIR/$t.rc"
            if [ ! -f "$f" ]; then echo "::error::$t did not run"; fail=1; continue; fi
            rc=$(cat "$f")
            case "$rc" in
              0) echo "$t: clean" ;;
              1) echo "::error::$t reported findings (exit 1)"; fail=1 ;;
              *) echo "::error::$t failed operationally (exit $rc)"; fail=1 ;;
            esac
          done
          exit "$fail"

  fork-notice:
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # Forks and Dependabot runs get no repository secrets, so Snyk cannot
      # authenticate. Skip it with a visible notice instead of failing on a
      # missing token; trusted refs still fail when the token is missing.
      - run: echo "::notice::Snyk skipped, no secrets for this actor. Snyk awaiting trusted execution"
