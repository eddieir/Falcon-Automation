name: Falcon CI

on:
  push:
    branches: [New_era_Falcon, main, "feat/**", "test/**"]
  pull_request:
    branches: [New_era_Falcon, main]
  # Manual re-run only. CI deliberately runs a fixed `--repeat=3` (see the
  # `test` job's falcon.js invocation below) rather than exposing a
  # dispatch input for it — on push/pull_request, `inputs.*` doesn't exist
  # as a context at all, so a step referencing it would silently resolve to
  # an empty string. An operator who wants a different repeat count runs
  # `node falcon.js --repeat=N` locally instead.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run's result moot, so
# cancel it to save runner minutes. Runs on main are never cancelled: each
# one is a record of that commit's result and also persists Falcon state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Fails on known high/critical advisories in production dependencies.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: regression-reports
          path: reports/
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    # Recent runs of this job finish in about 1.5-2 minutes; 10 minutes leaves
    # generous headroom for a cold cache while stopping a hung browser or
    # database step well before the 360-minute default.
    timeout-minutes: 10
    env:
      HEADLESS: "true"
      # falcon.js now reads CI=true itself to default the dashboard off (no
      # browser to view it here) — the --no-dashboard flag below is now
      # redundant but kept as an explicit belt-and-suspenders default.
      CI: "true"
      # Phase 6 — real Postgres for tests/db/*.js. This is a disposable CI-only
      # instance (the `postgres:` service below), not the production database,
      # so TLS is off and the credentials are throwaway values with no
      # relation to any real secret.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: falcon
      DB_PASS: falcon_ci_password
      DB_NAME: falcon_test
      DB_SSL: "false"

    services:
      postgres:
        # Pinned by digest. Tag postgres:16-alpine, digest resolved 2026-10-08.
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: falcon
          POSTGRES_PASSWORD: falcon_ci_password
          POSTGRES_DB: falcon_test
        ports:
          - 5432:5432
        # Block subsequent steps until Postgres is actually accepting
        # connections, not just until the container has started.
        options: >-
          --health-cmd "pg_isready -U falcon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Regression test for the Phase 6 exit-code fix ───────────────────────
      # No browser, no DB — runs first and fast. Locks in that
      # ReportManager.generateReport() actually sets process.exitCode, so a
      # future refactor can't silently reintroduce "CI step is always green
      # regardless of the actual test result."
      - name: Run ReportManager exit-code regression test
        run: node tests/unit/ReportManagerExitCode.check.js

      # A misconfigured database (wrong password, unreachable host) must be a
      # real failure, never mistaken for "no database configured." Doesn't
      # need the seeded Postgres below — it only needs the DB test files
      # themselves, run as child processes with deliberately broken configs.
      - name: Run DB config skip-vs-fail regression test
        run: node tests/unit/DBConfigBehavior.check.js

      # Real Dashboard instance on an ephemeral port, real HTTP requests, real
      # socket.io-client connections — proves both that auth is enforced when
      # DASHBOARD_TOKEN is set (unauthenticated POST /emit, GET /events, and
      # socket connections are all rejected) and that the default no-token
      # local-dev experience is unchanged.
      - name: Run Dashboard auth regression test
        run: node tests/unit/DashboardAuth.check.js

      # ── Database fixture (Phase 6) ──────────────────────────────────────────
      # Applies the same scripts/db/ci-seed.sql schema verified locally against
      # a disposable Postgres container. Re-running this against a fresh
      # service container on every job is intentional — the fixture is meant
      # to be rebuilt from scratch each run, not reused across CI runs.
      - name: Seed test database
        run: psql "postgresql://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/$DB_NAME" -f scripts/db/ci-seed.sql

      # Persist visual-regression baselines across runs on the same branch —
      # without this, reports/ (gitignored, never checked out) is empty on
      # every fresh runner, so LoginTest/CheckoutTest always take the
      # "capture baseline" branch and compare() (the code that actually
      # detects a regression) never executes in CI.
      - name: Restore visual regression baselines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/baselines
          key: vr-baselines-${{ github.ref_name }}
          restore-keys: |
            vr-baselines-

      # ── Scenario tests (custom runner) ──────────────────────────────────────
      - name: Run Login test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tests/ui/LoginTest.js

      - name: Run Checkout test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tests/ui/CheckoutTest.js

      - name: Run User API test
        run: node tests/api/UserApiTest.js

      - name: Run Product API test
        run: node tests/api/ProductApiTest.js

      # ── Database tests (Phase 6) ────────────────────────────────────────────
      # Deliberately no continue-on-error: these now run against a real,
      # seeded Postgres instance (see the `postgres:` service above), so a
      # failure here is a real signal, not a false positive to shrug off.
      - name: Run User DB test
        run: node tests/db/UserDBTest.js

      - name: Run Order DB test
        run: node tests/db/OrderDBTest.js

      # ── Falcon flakiness/quarantine/healing state (Phase 12) ────────────────
      # Restores the four gitignored data/*.json state files the tracker code
      # reads/writes; NOT the whole data/ dir — data/locator_store.json is
      # Phase 8's approved Tier-2 selector cache and must not be restored
      # here, or Phase 8 healing behavior in CI would silently change.
      #
      # data/locator_memory.json (Phase 14's evidence-based locator store) is
      # deliberately excluded here too, for a sharper reason than "scope
      # creep": entries land in it as "trusted" via the ground-truth path
      # with no approval gate at read time (only a Tier 2.5 PROPOSAL needs
      # human approval; recordEvidence() does not), and the restore-keys
      # above always fall back to the branch-prefix key
      # (falcon-state-<branch>-) because the exact run_id key can never hit
      # on a restore. If this file were added to that same restore/save
      # pair, a PR branch could silently inherit another branch's already-
      # approved locator memory — trusted ("trusted"), unproven
      # ("unproven"), or previously revoked ("revoked") evidence all follow
      # the restore key the same way, so a revocation recorded on one branch
      # would not protect a PR branch that restores stale state from before
      # it. This should be revisited only alongside a same-branch-provenance
      # check inside LocatorMemory itself (e.g. binding entries to the
      # branch/ref they were approved on), never as a CI-config-only change.
      - name: Restore Falcon state (flakiness/quarantine/healing)
        id: restore-falcon-state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/scenario_history.json
            data/quarantine_decisions.json
            data/healing_pending.json
            data/healing_decisions.json
          key: falcon-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            falcon-state-${{ github.ref_name }}-

      # ── Run history ledger (Phase 15) ───────────────────────────────────────
      # data/run_history.json is cached on its own key, deliberately apart from
      # the state-file cache above: the ledger is append-only trend data with a
      # different lifetime, and keeping it separate means nothing about the
      # healing/quarantine state can change because of it (SEC-13). The path
      # list is this one file and nothing else — never locator memory or the
      # locator store. As with the state cache, the run_id key never hits on
      # restore, so the prefix fallback brings back this branch's most recent
      # ledger; a first run on a branch, a PR branch, or a branch idle for 7
      # days (cache eviction) starts with an empty ledger.
      - name: Restore run history ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/run_history.json
          key: falcon-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            falcon-history-${{ github.ref_name }}-

      # ── Autonomous exploration (no dashboard in CI) ─────────────────────────
      - name: Run Falcon autonomous pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node falcon.js --no-dashboard --repeat=3

      # Runs even if the pipeline step above failed — the exact case where a
      # new failure sample must be persisted for D2/quarantine to accumulate.
      # An explicit, unconditional save is used instead of relying on
      # actions/cache's automatic post-job save, whose behavior after a
      # failing later step is unverified in this repo. continue-on-error is
      # deliberately scoped to this step alone: actions/cache/save fails
      # with a Path Validation Error when none of the listed paths exist, so
      # with if: always() a cold run where falcon.js dies before writing any
      # state would otherwise turn the job red for a pure infrastructure
      # reason unrelated to the quality gate (which is the falcon.js step's
      # own exit code, untouched by this).
      - name: Save Falcon state (flakiness/quarantine/healing)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/scenario_history.json
            data/quarantine_decisions.json
            data/healing_pending.json
            data/healing_decisions.json
          key: falcon-state-${{ github.ref_name }}-${{ github.run_id }}

      # Same reasoning as the state save above: runs even when the pipeline
      # failed, because a failing run is exactly the record the trend needs.
      # continue-on-error is scoped to this step alone — the save fails with a
      # Path Validation Error if falcon.js died before writing the ledger, which
      # is an infrastructure artefact, not a quality-gate result.
      - name: Save run history ledger
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/run_history.json
          key: falcon-history-${{ github.ref_name }}-${{ github.run_id }}

      # Exports the ledger as JSON and CSV into reports/history/, which the
      # falcon-reports upload at the end of the job already covers (14 days),
      # so a failed run still leaves a readable copy to download. --silent keeps
      # npm's own banner out of the redirected files.
      - name: Export run history
        if: always()
        run: |
          # Advisory: each export goes to a temp file and is moved into place only
          # on success, so a failed export leaves no partial file. A non-zero exit
          # is reported as a warning and never fails the job; the exit code is
          # handled explicitly rather than hidden behind a blanket "|| true".
          mkdir -p reports/history
          for fmt in json csv; do
            tmp="$RUNNER_TEMP/run_history.$fmt"
            rm -f "$tmp"
            rc=0
            npm run --silent history:export -- --format="$fmt" > "$tmp" || rc=$?
            if [ "$rc" -eq 0 ]; then
              mv "$tmp" "reports/history/run_history.$fmt"
            else
              echo "::warning::history export ($fmt) failed with exit code $rc; no file written"
              rm -f "$tmp"
            fi
          done

      # Advisory only: the trend check is written to the job summary so a
      # reviewer sees flagged scenarios, but it must never decide the job's
      # colour — hence no --strict, and a non-zero exit is reported inside the
      # block instead of failing the step. Output is truncated to stay well
      # under the summary size limit.
      - name: Run history trend check (advisory)
        if: always()
        run: |
          rc=0
          node scripts/history.js check > "$RUNNER_TEMP/history_check.txt" 2>&1 || rc=$?
          {
            echo "## Run history trend check (advisory)"
            echo '```'
            head -c 4000 "$RUNNER_TEMP/history_check.txt"
            [ "$rc" -eq 0 ] || echo "history check unavailable (exit $rc)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Review queue staleness (Phase 13) ────────────────────────────────────
      # Reports pending Tier 3 healing fixes and flaky-scenario decisions nobody
      # has acted on within threshold. Soft warning by default: findings are
      # always printed, but the step exits 0 for staleness alone, so this job's
      # red keeps meaning "a test failed" rather than "someone hasn't triaged the
      # review queue". It still exits non-zero on invalid arguments or invalid
      # configuration — that's a real defect, not a backlog signal.
      #
      # What this step can actually see: the exact cache key above embeds
      # github.run_id, so it never hits on restore and every restore falls back
      # to the falcon-state-<branch>- prefix. On a branch's very first run that
      # prefix matches nothing and there is no queue to report; on later pushes
      # to the same branch it does restore that branch's own earlier state. So a
      # queue only accumulates across runs on a long-lived branch — in practice
      # main — and a short-lived PR branch will usually have little or nothing
      # here.
      - name: Check review queue staleness
        run: node scripts/review/status.js

      # ── Playwright native suite (with Allure reporter) ──────────────────────
      - name: Run Playwright native tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test


      # ── Allure report generation ────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: |
          npx allure awesome allure-results -o allure-report || true

      # ── Upload all artefacts ────────────────────────────────────────────────
      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: falcon-reports
          path: |
            reports/
            allure-report/
            allure-results/
          if-no-files-found: ignore
          retention-days: 14

      # Recovery copy of the ledger, main only: caches are evicted after 7 idle
      # days, so this 90-day artifact is how a lost ledger on main is restored.
      # PR and feature-branch runs do not publish one.
      - name: Upload run history ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: run-history
          path: data/run_history.json
          if-no-files-found: ignore
          retention-days: 90

  # Phase 16: three shards of one run, each on a fresh runner. No secrets are
  # exposed to these jobs and no cache is saved from them (caches are only
  # restored read-only elsewhere); the fixture app is local, no external site.
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      HEADLESS: "true"
      CI: "true"
      RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      SHARD_INDEX: ${{ matrix.shard }}
      FIXTURE_PORT: "4173"
      # Non-secret and identical on every shard and in the aggregate job, so
      # locator signatures recorded by shards use the salt the merge expects.
      FALCON_LOCATOR_SALT: falcon-ci-shards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local fixture app
        run: |
          nohup node scripts/fixture/server.js --port="$FIXTURE_PORT" > "$RUNNER_TEMP/fixture.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$FIXTURE_PORT/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::fixture app did not become healthy"
          cat "$RUNNER_TEMP/fixture.log"
          exit 1
      - name: Run shard
        run: node falcon.js --no-dashboard --url="http://127.0.0.1:$FIXTURE_PORT" --shard="$SHARD_INDEX/3" --run-id="$RUN_ID"
      - name: Stage shard bundle
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/stage"
          if [ -d "reports/shards/$RUN_ID/shard-$SHARD_INDEX-of-3" ]; then
            cp -a "reports/shards/$RUN_ID/shard-$SHARD_INDEX-of-3" "$RUNNER_TEMP/stage/"
          else
            echo "::warning::no bundle produced for shard $SHARD_INDEX"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: falcon-shard-${{ matrix.shard }}-of-3-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CI: "true"
      FALCON_LOCATOR_SALT: falcon-ci-shards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: falcon-shard-*-of-3-${{ github.run_attempt }}
          path: shards-in
          merge-multiple: true
      # Read-only restore; locator_memory.json is never part of any cache.
      - name: Restore Falcon state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/scenario_history.json
            data/quarantine_decisions.json
            data/healing_pending.json
            data/healing_decisions.json
          key: falcon-state-agg-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            falcon-state-agg-${{ github.ref_name }}-
      # The exit code of the merge is the job result. The run id and commit are
      # passed through env (never interpolated into the script) and the merge
      # rejects bundles from another run or commit with exit 2.
      - name: Merge shards
        id: merge
        env:
          EXPECT_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p reports
          set -o pipefail
          node falcon.js merge --input=shards-in --expect-total=3 --expect-run-id="$EXPECT_RUN_ID" --expect-commit="$EXPECT_COMMIT" 2>&1 | tee reports/merge-output.txt
      # Mirrors the sequential job: state is saved on if: always() for main
      # (non-fork) so a failing run still records flaky history. The save fails
      # with a Path Validation Error when no state file exists (for example the
      # merge was rejected before writing any), so a check step reports whether
      # any file exists and the save is skipped otherwise. continue-on-error is
      # scoped to the cache save step alone, as in the sequential job; the merge
      # step's exit code, which is the quality gate, is untouched.
      - name: Check Falcon state files exist
        id: state-files
        if: always() && github.ref == 'refs/heads/main' && github.event.pull_request.head.repo.fork != true
        run: |
          mkdir -p data
          found=false
          for f in scenario_history quarantine_decisions healing_pending healing_decisions; do
            if [ -f "data/$f.json" ]; then found=true; fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" != "true" ]; then echo "::notice::no Falcon state files to save"; fi
      - name: Save Falcon state
        if: always() && steps.state-files.outputs.found == 'true' && github.ref == 'refs/heads/main' && github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/scenario_history.json
            data/quarantine_decisions.json
            data/healing_pending.json
            data/healing_decisions.json
          key: falcon-state-agg-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: falcon-merged-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            !reports/shards/
          if-no-files-found: warn
          retention-days: 14

  # Proves a missing shard is rejected: merge over only 2 of 3 bundles while
  # expecting 3 must exit 2 (rejected).
  shard-negative:
    needs: shards
    if: needs.shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: falcon-shard-*-of-3-${{ github.run_attempt }}
          path: shards-in
          merge-multiple: true
      - name: Merge with one shard missing must be rejected
        env:
          EXPECT_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/two"
          cp -a shards-in/shard-1-of-3 shards-in/shard-2-of-3 "$RUNNER_TEMP/two/"
          rc=0
          node falcon.js merge --input="$RUNNER_TEMP/two" --expect-total=3 --expect-run-id="$EXPECT_RUN_ID" --expect-commit="$EXPECT_COMMIT" || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit code 2 (rejected) for a missing shard, got $rc"
            exit 1
          fi
