name: Falcon CI

on:
  push:
    branches: [New_era_Falcon, main, "feat/**"]
  pull_request:
    branches: [New_era_Falcon, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HEADLESS: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Disable the live dashboard in CI (no browser to view it)
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Scenario tests (custom runner) ──────────────────────────────────────
      - name: Run Login test
        run: node tests/ui/LoginTest.js

      - name: Run Checkout test
        run: node tests/ui/CheckoutTest.js

      - name: Run User API test
        run: node tests/api/UserApiTest.js

      - name: Run Product API test
        run: node tests/api/ProductApiTest.js

      # ── Autonomous exploration (no dashboard in CI) ─────────────────────────
      - name: Run Falcon autonomous pipeline
        run: node falcon.js --no-dashboard

      # ── Playwright native suite (with Allure reporter) ──────────────────────
      - name: Run Playwright native tests
        run: npx playwright test
        continue-on-error: true  # Don't block the pipeline if E2E flakes

      # ── Allure report generation ────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report || true

      # ── Upload all artefacts ────────────────────────────────────────────────
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: falcon-reports
          path: |
            reports/
            allure-report/
          retention-days: 14
