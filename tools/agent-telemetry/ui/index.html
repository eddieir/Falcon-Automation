<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falcon Agent Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="title"><h1>Falcon Agent Dashboard</h1><span id="label" class="badge">…</span></div>
  <div class="live"><span id="dot" class="dot"></span><span id="updated">connecting…</span></div>
</header>
<div id="banner" class="banner" hidden></div>
<section id="limits" class="limits" aria-label="Subscription limits"></section>
<section id="cards" class="cards" aria-label="Summary"></section>
<section class="controls" aria-label="Filters">
  <input id="q" type="search" placeholder="Search agents, roles, ids, tools…" aria-label="Search">
  <select id="fSession" aria-label="Session filter"><option value="">All sessions</option></select>
  <select id="fModel" aria-label="Model filter"><option value="">All models</option></select>
  <select id="fStatus" aria-label="Status filter"><option value="">All statuses</option><option>running</option><option>completed</option><option>failed</option><option>interrupted</option><option>unknown</option><option>partial</option></select>
  <select id="fWindow" aria-label="Time window"><option value="900000">Last 15 min</option><option value="3600000">Last hour</option><option value="21600000" selected>Last 6 hours</option><option value="86400000">Last 24 hours</option><option value="0">All time</option></select>
  <label class="chk"><input id="fTools" type="checkbox"> tool events</label>
</section>
<nav id="tabs" role="tablist">
  <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
  <button role="tab" data-tab="hierarchy">Hierarchy</button>
  <button role="tab" data-tab="timeline">Timeline</button>
  <button role="tab" data-tab="usage">Usage</button>
  <button role="tab" data-tab="ledger">Ledger</button>
</nav>
<main id="main"></main>
<footer id="foot"></footer>
<script src="/app.js"></script>
</body>
</html>
