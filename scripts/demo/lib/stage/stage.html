<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falcon demo stage</title>
<style>
  :root { --bg:#0b0f17; --panel:#0f1623; --line:#1f2a3c; --text:#f2f5fa; --muted:#8c9ab0;
    --blue:#4da3ff; --amber:#ffb020; --purple:#a78bfa; --green:#34d399; --red:#f87171; --tone:var(--blue); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body.wide { width:1920px; height:1080px; }
  body.portrait { width:1080px; height:1350px; }
  .abs { position:absolute; }
  #header { left:0; top:0; width:100%; height:150px; background:var(--panel); border-bottom:1px solid var(--line); }
  #wordmark { font-weight:800; letter-spacing:.18em; font-size:30px; }
  #wordmark b { color:var(--tone); transition:color .25s; }
  #indicator { display:flex; gap:10px; align-items:center; }
  .chip { display:flex; align-items:center; gap:7px; padding:6px 12px 6px 6px; border-radius:999px; border:1px solid var(--line);
    color:var(--muted); font-size:18px; font-weight:600; white-space:nowrap; transition:background .25s,color .25s,border-color .25s; }
  .chip i { font-style:normal; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--line); color:var(--text); font-size:15px; font-weight:800; }
  .chip.done { color:var(--text); }
  .chip.done i { background:#2b3a52; }
  .chip.active { background:var(--tone); border-color:var(--tone); color:#06090f; }
  .chip.active i { background:#06090f; color:var(--tone); }
  .lbl { font-size:26px; font-weight:600; color:var(--muted); white-space:nowrap; }
  #card { overflow:hidden; border-left:5px solid var(--tone); padding-left:16px; transition:opacity .25s,border-color .25s; }
  #card.off { opacity:0; }
  #card .t { font-size:28px; font-weight:800; line-height:34px; }
  #card .r { display:flex; flex-wrap:wrap; gap:2px 26px; margin-top:4px; font-size:22px; line-height:28px; }
  #card .r span { color:var(--muted); }
  #card .r b { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--text); font-weight:700; }
  #card.compare .t { font-size:19px; line-height:22px; color:var(--muted); }
  #card.compare .cmp { display:flex; align-items:center; gap:12px; margin-top:4px; }
  #card.compare .cmp div { font-size:19px; font-weight:800; line-height:24px; padding:2px 10px; border-radius:7px; background:var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px; }
  #card.compare .cmp div em { font-style:normal; color:var(--muted); font-weight:600; font-size:15px; margin-right:6px; }
  #card.compare .cmp div b { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--tone); }
  #card.compare .cmp u { text-decoration:none; font-size:24px; color:var(--tone); font-weight:800; }
  .win { background:#0a0d13; border:1px solid var(--line); }
  #captionBand { background:var(--panel); border-top:1px solid var(--line); display:flex; align-items:center; }
  #captionBand::before { content:""; align-self:stretch; width:10px; background:var(--tone); transition:background .25s; flex:0 0 10px; }
  #caption { flex:1; padding:0 28px; font-weight:800; line-height:1.04; color:var(--text); white-space:pre-line; overflow:hidden;
    transition:opacity .25s; }
  #caption.off { opacity:0; }

  body.wide #wordmark { left:24px; top:30px; }
  body.wide #indicator { left:230px; top:26px; }
  body.wide #card { left:1096px; top:18px; width:800px; height:96px; }
  body.wide .lbl.a { left:24px; top:116px; } body.wide .lbl.b { left:984px; top:116px; }
  body.wide #winA { left:0; top:150px; width:960px; height:840px; }
  body.wide #winB { left:960px; top:150px; width:960px; height:840px; }
  body.wide #captionBand { left:0; top:990px; width:1920px; height:90px; }
  body.wide #caption { font-size:44px; max-height:88px; }

  body.portrait #wordmark { left:20px; top:12px; font-size:24px; }
  body.portrait #indicator { left:190px; top:10px; gap:8px; }
  body.portrait .chip { font-size:22px; padding:5px 12px 5px 5px; }
  body.portrait .chip:not(.active) { padding:5px; } body.portrait .chip:not(.active) span { display:none; }
  body.portrait .lbl { font-size:26px; left:20px; top:58px; }
  body.portrait .lbl.b { display:none; }
  body.portrait #card { left:20px; top:98px; width:1040px; height:48px; border-left-width:4px; padding-left:12px; }
  body.portrait #card .t { display:inline; font-size:24px; line-height:24px; margin-right:14px; }
  body.portrait #card .r { display:inline-flex; margin:0; font-size:20px; line-height:24px; gap:0 16px; }
  body.portrait #card.compare .t { display:none; }
  body.portrait #card.compare .cmp { margin-top:0; }
  body.portrait #card.compare .cmp div { font-size:24px; line-height:30px; }
  body.portrait #card.compare .cmp div em { font-size:18px; }
  body.portrait #winA { left:0; top:150px; width:1080px; height:500px; }
  body.portrait #winB { left:0; top:650px; width:1080px; height:560px; }
  body.portrait #captionBand { left:0; top:1210px; width:1080px; height:140px; }
  body.portrait #caption { font-size:42px; max-height:128px; }

  #overlay { left:0; top:0; width:100%; height:100%; background:var(--bg); opacity:0; pointer-events:none; transition:opacity .25s;
    display:flex; flex-direction:column; justify-content:center; align-items:center; padding:60px; }
  #overlay.on { opacity:1; }
  #overlay h1 { font-size:64px; font-weight:800; margin-bottom:44px; text-align:center; }
  .ev { display:flex; width:100%; max-width:1300px; align-items:center; justify-content:space-between; padding:20px 28px; margin-bottom:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; font-size:42px; font-weight:700; }
  .ev span { color:var(--muted); font-weight:600; } .ev b { color:var(--red); text-align:right; }
  .ev b.ok { color:var(--green); }
  body.portrait .ev { flex-direction:column; align-items:flex-start; gap:6px; font-size:40px; }
  body.portrait .ev b { text-align:left; }
  body.portrait #overlay h1 { font-size:54px; }
  .foot { margin-top:22px; font-size:28px; color:var(--muted); }
  .end { text-align:center; max-width:1500px; }
  .end .n { font-size:96px; font-weight:800; letter-spacing:.04em; }
  .end .s { font-size:48px; font-weight:600; margin-top:22px; }
  .end .d { font-size:42px; font-weight:700; color:var(--blue); margin-top:36px; }
  .end .m { font-size:34px; color:var(--muted); margin-top:44px; }
  .end .u { font-size:44px; font-weight:800; margin-top:10px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .end .f { font-size:34px; margin-top:44px; line-height:1.3; }
  body.portrait .end .n { font-size:72px; } body.portrait .end .s { font-size:42px; } body.portrait .end .u { font-size:36px; }
  body.portrait .end .f, body.portrait .end .m { font-size:32px; } body.portrait .end .d { font-size:38px; }
</style>
</head>
<body class="wide">
<div id="header" class="abs">
  <div id="wordmark" class="abs"><b>&#9650;</b> FALCON</div>
  <div id="indicator" class="abs"></div>
  <div id="card" class="abs off"></div>
  <div class="lbl abs a">Application under test</div>
  <div class="lbl abs b">Falcon dashboard</div>
</div>
<div id="winA" class="win abs"></div>
<div id="winB" class="win abs"></div>
<div id="captionBand" class="abs"><div id="caption" class="off"></div></div>
<div id="overlay" class="abs"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var layout = q.get("layout") === "portrait" ? "portrait" : "wide";
  document.body.className = layout;
  if (layout === "portrait") document.querySelector(".lbl.a").textContent = "Top: Application under test · Bottom: Falcon dashboard";
  var STEPS = ["Baseline", "Locator changed", "Recovery", "Human approval", "Approved reuse"];
  var TONES = { blue: "--blue", amber: "--amber", purple: "--purple", green: "--green", red: "--red" };
  var ind = document.getElementById("indicator"), card = document.getElementById("card"), cap = document.getElementById("caption"),
      ov = document.getElementById("overlay");
  var baseSize = layout === "portrait" ? 42 : 44, minSize = layout === "portrait" ? 40 : 40;

  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function setIndicator(idx) {
    ind.innerHTML = STEPS.map(function (s, i) {
      var c = i + 1 === idx ? "active" : (i + 1 < idx ? "done" : "");
      return '<div class="chip ' + c + '"><i>' + (i + 1) + "</i><span>" + esc(s) + "</span></div>";
    }).join("");
  }
  function setCard(c) {
    if (!c) { card.className = "abs off"; return; }
    if (c.kind === "compare") {
      var r = c.rows || [];
      var cell = function (x) { return '<div><em>' + esc(x[0]) + ':</em><b>' + esc(x[1]) + "</b></div>"; };
      card.className = "abs compare";
      card.innerHTML = '<div class="t">' + esc(c.title) + '</div><div class="cmp">' + cell(r[0] || ["", ""]) + "<u>&rarr;</u>" + cell(r[1] || ["", ""]) + "</div>";
      return;
    }
    card.className = "abs";
    card.innerHTML = '<div class="t">' + esc(c.title) + '</div><div class="r">' +
      (c.rows || []).map(function (x) { return "<div><span>" + esc(x[0]) + ":</span> <b>" + esc(x[1]) + "</b></div>"; }).join("") + "</div>";
  }
  function setCaption(text) {
    cap.classList.add("off");
    setTimeout(function () {
      cap.textContent = text || "";
      var s = baseSize; cap.style.fontSize = s + "px";
      while (cap.scrollHeight > cap.clientHeight + 1 && s > minSize) { s -= 2; cap.style.fontSize = s + "px"; }
      if (text) cap.classList.remove("off");
    }, 120);
  }
  var api = {
    setState: function (st) {
      st = st || {};
      document.documentElement.style.setProperty("--tone", "var(" + (TONES[st.tone] || "--blue") + ")");
      setIndicator(st.stageIndex || 1);
      setCard(st.card || null);
      setCaption(st.caption || "");
      ov.classList.remove("on");
    },
    showVersionCompare: function (v) {
      api.setState({ stageIndex: 2, tone: "amber", caption: "The product still works. The old selector does not.",
        card: { kind: "compare", title: "Release change", rows: [["Release v1", "#" + v.v1], ["Release v2", "#" + v.v2]] } });
    },
    showEvidence: function (rows, footnote) {
      ov.innerHTML = "<h1>What Falcon recorded</h1>" + (rows || []).map(function (r) {
        return '<div class="ev"><span>' + esc(r[0]) + ":</span><b" + (r[2] ? ' class="ok"' : "") + ">" + esc(r[1]) + "</b></div>";
      }).join("") + (footnote ? '<div class="foot">' + esc(footnote) + "</div>" : "");
      ov.classList.add("on");
    },
    showEndCard: function (lines) {
      var l = lines || [];
      ov.innerHTML = '<div class="end"><div class="n">' + esc(l[0]) + '</div><div class="s">' + esc(l[1]) + '</div><div class="d">' + esc(l[2]) +
        '</div><div class="m">' + esc(l[3]) + '</div><div class="u">' + esc(l[4]) + '</div><div class="f">' + esc(l[5]) + "</div></div>";
      ov.classList.add("on");
    }
  };
  window.stageApi = api;
  setIndicator(1);
  window.stageReady = true;
})();
</script>
</body>
</html>
